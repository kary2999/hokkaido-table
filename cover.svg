<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#e6edf3"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1d4d7a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1d4d7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 极简横线 -->
  <line x1="60" y1="100" x2="200" y2="100" stroke="#1d4d7a" stroke-width="3"/>
  <text x="60" y="135" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="6" fill="#1d4d7a" font-weight="bold">HOKKAIDO · 北海道</text>
  <!-- 雪花点 -->
  <circle cx="1100" cy="120" r="3" fill="#1d4d7a" opacity="0.6"/>
  <circle cx="1080" cy="160" r="2" fill="#1d4d7a" opacity="0.5"/>
  <circle cx="1130" cy="180" r="2" fill="#1d4d7a" opacity="0.4"/>
  <circle cx="1060" cy="200" r="3" fill="#1d4d7a" opacity="0.7"/>


  <!-- 编号 + 区域 -->
  <text x="60" y="75" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="4" fill="#1d4d7a" font-weight="bold">NO. 04 · 远方来信 · LETTERS FROM AFAR</text>

  <!-- 主标题 中文 -->
  <text x="60" y="320" font-family="STSong, 'Songti SC', serif" font-size="120" fill="#1c2128" font-weight="700" letter-spacing="0.04em">北海道·雪国食单</text>

  <!-- 主标题 英文 -->
  <text x="60" y="380" font-family="JetBrains Mono, monospace" font-size="22" fill="#3a76a8" letter-spacing="8" font-weight="bold">HOKKAIDO TABLE</text>

  <!-- Tagline -->
  <text x="60" y="475" font-family="STSong, serif" font-size="34" fill="#1c2128" font-weight="400" opacity="0.9">雪国的桌子</text>

  <!-- 区域 -->
  <text x="60" y="595" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="6" fill="#3a76a8" font-weight="bold">北海道</text>

  <!-- 站点 URL -->
  <text x="1140" y="595" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#1d4d7a" font-weight="bold">kary2999.github.io/hokkaido-table/</text>
</svg>
